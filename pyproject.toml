# GrowLead fork tooling (GRO-1302, Python Standard v1, adopce vlna 1).
# Upstream faborsky/google-ads-app tento soubor nemá. Runtime pořád čte requirements.txt
# (setup.sh / run.sh), proto [project].dependencies MUSÍ zrcadlit requirements.txt 1:1;
# hlídá to .github/scripts/check_requirements_sync.py v CI i v `make check`.
# Zdroj pravdy pro CI je uv.lock.

[project]
name = "google-ads-app"
# Není distribuovaný balík. Verze aplikace žije v gads/__init__.py (__version__).
version = "0.0.0"
description = "Google Ads CLI (fork faborsky/google-ads-app, GrowLead growlead-safety)"
readme = "README.md"
# Standard = 3.12. Horní mez: knihovna google-ads zatím nepodporuje 3.15 (README upstreamu).
requires-python = ">=3.12,<3.15"
dependencies = [
    "google-ads>=31.4.0,<32",
    "python-dotenv>=1.0.0",
    "google-auth-oauthlib>=1.2.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    # Stejný rozsah jako upstream requirements-dev.txt; pytest 9 až ve vlně 2.
    "pytest>=8,<9",
    "ruff==0.16.7",
    "pip-audit==2.10.1",
    # Síťová pojistka testů (addopts --disable-socket), config-only, bez změny upstream testů.
    "pytest-socket==0.8.1",
    # Import v .github/scripts/check_requirements_sync.py, explicitně (ne tranzitivně přes pytest).
    "packaging==26.3",
]

[tool.uv]
# Aplikace se spouští z rootu (google_ads_cli.py), nic se nebuildí ani neinstaluje.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Vlna 1: jen chyby, které znamenají rozbitý kód (syntax, nedefinovaná jména).
# Plná pravidla standardu přijdou ve vlně 2 přes baseline, NE přes `ruff --fix` upstream kódu.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --disable-socket: test, který by omylem obešel mock (requests, google-auth), spadne místo volání ven.
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket"
filterwarnings = ["error"]
markers = [
    "integration: needs network or real credentials (never part of CI; none exist today)",
]
